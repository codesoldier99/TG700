  <text x="450.0" y="706.0" font-size="12" text-anchor="middle" fill="#868e96">四个朝向全部以机体为基准（机头 / 机尾 / 左 / 右），不依赖观察者站在哪一侧 —— 这是本方案相对旧「切向」规则的关键改进</text>
