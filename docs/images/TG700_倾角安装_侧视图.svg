<svg xmlns="http://www.w3.org/2000/svg" width="980" height="690" viewBox="0 0 980 690" font-family="Microsoft YaHei, DengXian, SimHei, sans-serif">

  <defs>
    <marker id="tRed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#e03131"/>
    </marker>
    <marker id="tBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#1971c2"/>
    </marker>
    <marker id="tGray" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#868e96"/>
    </marker>
    <marker id="tOrange" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#e8590c"/>
    </marker>
  </defs>

  <rect width="980" height="690" fill="#ffffff"/>

  <text x="490" y="32" font-size="22" font-weight="bold" text-anchor="middle" fill="#212529">单组共轴电机倾角安装 - 侧视剖面</text>
  <text x="490" y="55" font-size="13" text-anchor="middle" fill="#c92a2a">注：图中倾角为示意放大（画成约 18° / 10°），实际切向 5°、向心 2°</text>

  <!-- ================= 面板 A：切向 5° ================= -->
  <rect x="30" y="72" width="440" height="580" rx="10" fill="#fbfbfc" stroke="#dee2e6" stroke-width="1.5"/>
  <text x="250" y="100" font-size="16" font-weight="bold" text-anchor="middle" fill="#212529">A. 切向倾角 5°（偏航力矩来源）</text>
  <text x="250" y="122" font-size="12.5" text-anchor="middle" fill="#6741d9">视角：站在臂端，面朝飞机中心（向内看）</text>

  <line x1="250" y1="185" x2="250" y2="440" stroke="#adb5bd" stroke-width="13" stroke-linecap="round"/>
  <text x="306" y="437" font-size="11.5" fill="#868e96">电机座立柱</text>
  <line x1="250" y1="172" x2="250" y2="455" stroke="#ced4da" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- 上层 CW -->
  <ellipse cx="250" cy="235" rx="74" ry="11" fill="#ffe3e3" stroke="#e03131" stroke-width="2" transform="rotate(-18 250 235)"/>
  <circle cx="250" cy="235" r="9" fill="#e03131"/>
  <line x1="250" y1="235" x2="217" y2="145" stroke="#e03131" stroke-width="3.6" marker-end="url(#tRed)"/>
  <text x="196" y="150" font-size="13" font-weight="bold" text-anchor="end" fill="#e03131">推力 T</text>
  <line x1="250" y1="235" x2="250" y2="166" stroke="#868e96" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#tGray)"/>
  <text x="276" y="201" font-size="11.5" fill="#868e96">T·cos5°</text>
  <line x1="250" y1="190" x2="219" y2="190" stroke="#e8590c" stroke-width="2.2" marker-end="url(#tOrange)"/>
  <text x="214" y="185" font-size="11.5" font-weight="bold" text-anchor="end" fill="#e8590c">T·sin5°</text>
  <path d="M 250 200 A 35 35 0 0 0 239.2 202" fill="none" stroke="#495057" stroke-width="1.4"/>
  <text x="224" y="216" font-size="12" font-weight="bold" fill="#495057">5°</text>
  <text x="334" y="231" font-size="13" font-weight="bold" fill="#e03131">上层 · CW</text>
  <text x="334" y="250" font-size="12" fill="#495057">顶部倾向【左】</text>

  <!-- 下层 CCW -->
  <ellipse cx="250" cy="390" rx="74" ry="11" fill="#e7f5ff" stroke="#1971c2" stroke-width="2" transform="rotate(18 250 390)"/>
  <circle cx="250" cy="390" r="9" fill="#1971c2"/>
  <line x1="250" y1="390" x2="283" y2="300" stroke="#1971c2" stroke-width="3.6" marker-end="url(#tBlue)"/>
  <text x="300" y="296" font-size="13" font-weight="bold" fill="#1971c2">推力 T</text>
  <line x1="250" y1="332" x2="281" y2="332" stroke="#e8590c" stroke-width="2.2" marker-end="url(#tOrange)"/>
  <text x="288" y="337" font-size="11.5" font-weight="bold" fill="#e8590c">T·sin5°</text>
  <path d="M 250 355 A 35 35 0 0 1 260.8 357" fill="none" stroke="#495057" stroke-width="1.4"/>
  <text x="264" y="371" font-size="12" font-weight="bold" fill="#495057">5°</text>
  <text x="166" y="386" font-size="13" font-weight="bold" text-anchor="end" fill="#1971c2">下层 · CCW</text>
  <text x="166" y="405" font-size="12" text-anchor="end" fill="#495057">顶部倾向【右】</text>

  <line x1="58" y1="478" x2="442" y2="478" stroke="#dee2e6" stroke-width="1.5"/>
  <text x="58" y="504" font-size="12.5" fill="#212529"><tspan font-weight="bold">两个水平分力方向相反</tspan>，形成一对力偶</text>
  <text x="58" y="528" font-size="12.5" fill="#212529">上层减推力 + 下层加推力，产生净水平力，<tspan font-weight="bold" fill="#2f9e44">形成偏航</tspan></text>
  <text x="58" y="558" font-size="12.5" fill="#495057">垂直分力 T·cos5° = 0.9962·T（升力仅损失 0.38%）</text>
  <text x="58" y="582" font-size="12.5" fill="#495057">水平分力 T·sin5° = 0.0872·T</text>
  <text x="58" y="614" font-size="12.5" font-weight="bold" fill="#c92a2a">若上下两个倾斜方向装错，</text>
  <text x="58" y="636" font-size="12.5" font-weight="bold" fill="#c92a2a">力偶消失或反向，偏航失效</text>

  <!-- ================= 面板 B：向心 2° ================= -->
  <rect x="500" y="72" width="450" height="580" rx="10" fill="#fbfbfc" stroke="#dee2e6" stroke-width="1.5"/>
  <text x="725" y="100" font-size="16" font-weight="bold" text-anchor="middle" fill="#212529">B. 向心倾角 2°（上下同向）</text>
  <text x="725" y="122" font-size="12.5" text-anchor="middle" fill="#6741d9">视角：沿切向看（飞机中心在图的左侧）</text>

  <line x1="616" y1="160" x2="556" y2="160" stroke="#495057" stroke-width="2" marker-end="url(#tGray)"/>
  <text x="624" y="165" font-size="12" fill="#212529">朝飞机中心（向内）</text>

  <line x1="760" y1="200" x2="760" y2="440" stroke="#adb5bd" stroke-width="13" stroke-linecap="round"/>
  <line x1="760" y1="190" x2="760" y2="455" stroke="#ced4da" stroke-width="1.2" stroke-dasharray="5 4"/>

  <ellipse cx="760" cy="250" rx="70" ry="10" fill="#ffe3e3" stroke="#e03131" stroke-width="2" transform="rotate(-10 760 250)"/>
  <circle cx="760" cy="250" r="8" fill="#e03131"/>
  <line x1="760" y1="250" x2="744" y2="200" stroke="#e03131" stroke-width="3.4" marker-end="url(#tRed)"/>
  <path d="M 760 215 A 35 35 0 0 0 753.9 216" fill="none" stroke="#495057" stroke-width="1.4"/>
  <text x="722" y="230" font-size="12" font-weight="bold" fill="#495057">2°</text>
  <text x="842" y="252" font-size="12.5" font-weight="bold" fill="#e03131">上层 CW</text>

  <ellipse cx="760" cy="385" rx="70" ry="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2" transform="rotate(-10 760 385)"/>
  <circle cx="760" cy="385" r="8" fill="#1971c2"/>
  <line x1="760" y1="385" x2="744" y2="335" stroke="#1971c2" stroke-width="3.4" marker-end="url(#tBlue)"/>
  <path d="M 760 350 A 35 35 0 0 0 753.9 351" fill="none" stroke="#495057" stroke-width="1.4"/>
  <text x="722" y="365" font-size="12" font-weight="bold" fill="#495057">2°</text>
  <text x="842" y="387" font-size="12.5" font-weight="bold" fill="#1971c2">下层 CCW</text>

  <line x1="528" y1="478" x2="922" y2="478" stroke="#dee2e6" stroke-width="1.5"/>
  <text x="528" y="504" font-size="12.5" fill="#212529"><tspan font-weight="bold">上下两个电机向心方向完全相同</tspan>（都朝内 2°）</text>
  <text x="528" y="528" font-size="12.5" fill="#495057">水平分力同向，互相抵消，不产生偏航</text>
  <text x="528" y="552" font-size="12.5" fill="#495057">作用：改善横滚力矩线性度、降低桨间干扰</text>
  <text x="528" y="584" font-size="12.5" fill="#212529">合成总倾角 = √(25 + 4) = √29 ≈ <tspan font-weight="bold">5.4°</tspan></text>
  <text x="528" y="614" font-size="12.5" fill="#495057">油门因子 = cos5° × cos2° = <tspan font-weight="bold">0.9956</tspan></text>
  <text x="528" y="636" font-size="12.5" fill="#495057">升力损失仅 0.44%</text>

</svg>
