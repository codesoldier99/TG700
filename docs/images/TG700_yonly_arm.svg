<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" font-family="'Microsoft YaHei','Noto Sans CJK SC','WenQuanYi Zen Hei',sans-serif">
<defs>
<marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6fb4"/></marker>
<marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c1452b"/></marker>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12862f"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="470" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1c1c1c">图3  为什么外侧组也只剩 1.665 m 力矩臂</text>
<text x="470" y="55" text-anchor="middle" font-size="14" fill="#6b6b6b">水平力沿 ±Y 时，Mz = x·Fy，力矩臂只看 |X|，与在内侧还是外侧无关</text>
<line x1="190.0" y1="194.1" x2="190.0" y2="370.0" stroke="#dcdcdc" stroke-width="1.8" stroke-dasharray="6 4"/>
<line x1="156.0" y1="330.0" x2="503.6" y2="330.0" stroke="#dcdcdc" stroke-width="1.8" stroke-dasharray="6 4"/>
<circle cx="190.0" cy="330.0" r="5" fill="#6b6b6b"/>
<text x="180.0" y="350.0" text-anchor="end" font-size="12" fill="#6b6b6b" font-weight="normal">CG</text>
<line x1="166.0" y1="240.1" x2="407.6" y2="240.1" stroke="#e6e6e6" stroke-width="9"/>
<circle cx="373.6" cy="240.1" r="24" fill="#f2f2f2" stroke="#b8b8b8" stroke-width="2"/>
<text x="373.6" y="204.1" text-anchor="middle" font-size="14" fill="#1c1c1c" font-weight="bold">P1 前右外</text>
<line x1="190.0" y1="240.1" x2="373.6" y2="240.1" stroke="#c4c4c4" stroke-width="2.2" stroke-dasharray="5 4"/>
<text x="281.8" y="226.1" text-anchor="middle" font-size="13" fill="#9a9a9a" font-weight="normal">|Y| = 3.400 m  (沿 ±X 倾角才用得上)</text>
<line x1="373.6" y1="240.1" x2="373.6" y2="330.0" stroke="#12862f" stroke-width="2.6" stroke-dasharray="5 4"/>
<text x="361.6" y="281.0" text-anchor="end" font-size="14" fill="#12862f" font-weight="bold">|X| = 1.665 m</text>
<text x="361.6" y="301.0" text-anchor="end" font-size="12" fill="#12862f" font-weight="normal">有效力矩臂</text>
<line x1="166.0" y1="240.1" x2="505.6" y2="240.1" stroke="#bfe0c6" stroke-width="1.6" stroke-dasharray="4 4"/>
<line x1="397.6" y1="240.1" x2="477.6" y2="240.1" stroke="#12862f" stroke-width="3.4" marker-end="url(#ag)"/>
<text x="485.6" y="245.1" text-anchor="start" font-size="14" fill="#12862f" font-weight="bold">Fy</text>
<text x="166.0" y="392.0" text-anchor="start" font-size="13" fill="#1c1c1c" font-weight="normal">Mz = x·Fy — 力的作用线到 CG 的垂直距离就是 |X|，</text>
<text x="166.0" y="414.0" text-anchor="start" font-size="13" fill="#1c1c1c" font-weight="normal">所以外侧组的 3.4 m 完全用不上，16 台电机力矩臂全部相同。</text>
<rect x="590" y="96" width="320" height="300" rx="10" fill="#fbfbfb" stroke="#dcdcdc"/>
<line x1="600" y1="140.0" x2="900" y2="140.0" stroke="#c8c8c8" stroke-width="1.4"/>
<text x="610.0" y="128.0" text-anchor="start" font-size="13" fill="#1c1c1c" font-weight="bold">方案</text>
<text x="780.0" y="128.0" text-anchor="end" font-size="13" fill="#1c1c1c" font-weight="bold">偏航权限</text>
<text x="896.0" y="128.0" text-anchor="end" font-size="13" fill="#1c1c1c" font-weight="bold"></text>
<text x="610.0" y="166.0" text-anchor="start" font-size="13" fill="#1c1c1c" font-weight="normal">理想切向 5°</text>
<text x="780.0" y="166.0" text-anchor="end" font-size="13" fill="#1c1c1c" font-weight="normal">1.8523</text>
<text x="896.0" y="166.0" text-anchor="end" font-size="13" fill="#1c1c1c" font-weight="normal">123%</text>
<text x="610.0" y="204.0" text-anchor="start" font-size="13" fill="#1c1c1c" font-weight="normal">±X/±Y 四向 5°</text>
<text x="780.0" y="204.0" text-anchor="end" font-size="13" fill="#1c1c1c" font-weight="normal">1.5085</text>
<text x="896.0" y="204.0" text-anchor="end" font-size="13" fill="#1c1c1c" font-weight="normal">100%</text>
<text x="610.0" y="242.0" text-anchor="start" font-size="13" fill="#12862f" font-weight="bold">±Y 单向 5°</text>
<text x="780.0" y="242.0" text-anchor="end" font-size="13" fill="#12862f" font-weight="bold">1.2057</text>
<text x="896.0" y="242.0" text-anchor="end" font-size="13" fill="#12862f" font-weight="bold">80%</text>
<text x="610.0" y="280.0" text-anchor="start" font-size="13" fill="#1c1c1c" font-weight="normal">±Y 单向 6.31°</text>
<text x="780.0" y="280.0" text-anchor="end" font-size="13" fill="#1c1c1c" font-weight="normal">1.5090</text>
<text x="896.0" y="280.0" text-anchor="end" font-size="13" fill="#1c1c1c" font-weight="normal">100%</text>
<text x="610.0" y="318.0" text-anchor="start" font-size="13" fill="#1c1c1c" font-weight="normal">±Y 单向 8°</text>
<text x="780.0" y="318.0" text-anchor="end" font-size="13" fill="#1c1c1c" font-weight="normal">1.8986</text>
<text x="896.0" y="318.0" text-anchor="end" font-size="13" fill="#1c1c1c" font-weight="normal">126%</text>
<text x="610.0" y="356.0" text-anchor="start" font-size="13" fill="#1c1c1c" font-weight="normal">±Y 单向 10°</text>
<text x="780.0" y="356.0" text-anchor="end" font-size="13" fill="#1c1c1c" font-weight="normal">2.3578</text>
<text x="896.0" y="356.0" text-anchor="end" font-size="13" fill="#1c1c1c" font-weight="normal">156%</text>
<text x="610.0" y="400.0" text-anchor="start" font-size="12" fill="#12862f" font-weight="bold">6.31° 就能追平四向方案</text>
<text x="610.0" y="420.0" text-anchor="start" font-size="12" fill="#6b6b6b" font-weight="normal">升力代价仅 0.61% (700kg 折 4.2kg)</text>
</svg>