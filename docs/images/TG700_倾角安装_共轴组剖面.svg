<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="Microsoft YaHei,Noto Sans CJK SC,SimHei,DejaVu Sans,sans-serif">
  <defs>
    <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e03131"/>
    </marker>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1971c2"/>
    </marker>
    <marker id="aK" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#212529"/>
    </marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#868e96"/>
    </marker>
    <marker id="tR" viewBox="0 0 10 10" refX="5" refY="5"
            markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e03131"/>
    </marker>
    <marker id="tG" viewBox="0 0 10 10" refX="5" refY="5"
            markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#868e96"/>
    </marker>
  </defs>

  <rect width="900" height="500" fill="#ffffff"/>
  <text x="450" y="34" font-size="21" font-weight="bold" text-anchor="middle" fill="#212529">单个共轴组剖面：上下两台电机必须反向倾斜 5°</text>
  <text x="450" y="58" font-size="13" text-anchor="middle" fill="#868e96">以 P1（前右外，沿 ±X 倾斜）为例 · 从飞机右侧看进去 · 机头在左 · 图中倾角已放大约 3 倍以便观察</text>
  <line x1="300.0" y1="150.0" x2="300.0" y2="402.0" stroke="#adb5bd" stroke-width="7.0"/>
  <rect x="240.0" y="402" width="120" height="18" rx="6" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.6"/>
  <text x="300.0" y="438.0" font-size="11.5" text-anchor="middle" fill="#868e96">吊舱立柱 / 机臂</text>
  <line x1="300.0" y1="190.0" x2="300.0" y2="98.0" stroke="#ced4da" stroke-width="1.4" stroke-dasharray="4 3"/>
  <line x1="300.0" y1="190.0" x2="276.2" y2="101.1" stroke="#e03131" stroke-width="3.8" marker-end="url(#aR)"/>
  <text x="264.2" y="93.1" font-size="12" text-anchor="end" fill="#e03131" font-weight="bold">推力</text>
  <path d="M 300.0 144.0 A 46 46 0 0 0 288.1 145.6" fill="none" stroke="#e03131" stroke-width="1.3"/>
  <text x="266.0" y="138.0" font-size="11.5" text-anchor="end" fill="#e03131">5°</text>
  <ellipse cx="300.0" cy="190.0" rx="88.0" ry="7" fill="none" stroke="#e03131" stroke-width="3" transform="rotate(-15.00 300.0 190.0)"/>
  <circle cx="300.0" cy="190.0" r="11" fill="#e03131"/>
  <text x="194.0" y="195.0" font-size="12.5" text-anchor="end" fill="#e03131" font-weight="bold">上层　CW 顺时针桨</text>
  <line x1="300.0" y1="162.0" x2="224.0" y2="162.0" stroke="#e03131" stroke-width="2.8" marker-end="url(#aR)"/>
  <text x="214.0" y="153.0" font-size="11.5" text-anchor="end" fill="#e03131">水平分力 → 机头</text>
  <line x1="300.0" y1="330.0" x2="300.0" y2="238.0" stroke="#ced4da" stroke-width="1.4" stroke-dasharray="4 3"/>
  <line x1="300.0" y1="330.0" x2="323.8" y2="241.1" stroke="#1971c2" stroke-width="3.8" stroke-dasharray="8 4.5" marker-end="url(#aB)"/>
  <text x="335.8" y="233.1" font-size="12" text-anchor="start" fill="#1971c2" font-weight="bold">推力</text>
  <path d="M 300.0 284.0 A 46 46 0 0 1 311.9 285.6" fill="none" stroke="#1971c2" stroke-width="1.3"/>
  <text x="334.0" y="278.0" font-size="11.5" text-anchor="start" fill="#1971c2">5°</text>
  <ellipse cx="300.0" cy="330.0" rx="88.0" ry="7" fill="none" stroke="#1971c2" stroke-width="3" transform="rotate(15.00 300.0 330.0)"/>
  <circle cx="300.0" cy="330.0" r="11" fill="#1971c2"/>
  <text x="194.0" y="335.0" font-size="12.5" text-anchor="end" fill="#1971c2" font-weight="bold">下层　CCW 逆时针桨</text>
  <line x1="300.0" y1="358.0" x2="376.0" y2="358.0" stroke="#1971c2" stroke-width="2.8" marker-end="url(#aB)"/>
  <text x="386.0" y="375.0" font-size="11.5" text-anchor="start" fill="#1971c2">水平分力 → 机尾</text>
  <line x1="140.0" y1="380.0" x2="74.0" y2="380.0" stroke="#212529" stroke-width="2.2" marker-end="url(#aK)"/>
  <text x="107.0" y="402.0" font-size="13" text-anchor="middle" fill="#212529" font-weight="bold">机头</text>
  <rect x="530" y="150" width="348" height="212" rx="9" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.4"/>
  <text x="548.0" y="176.0" font-size="12.3" text-anchor="start" fill="#212529" font-weight="bold">上下两台的水平分力方向相反，构成一个纯力偶</text>
  <text x="548.0" y="199.0" font-size="12.3" text-anchor="start" fill="#212529">→ 绕重心产生偏航力矩，力矩臂 = |Y| = 3.4 m</text>
  <text x="548.0" y="222.0" font-size="12.3" text-anchor="start" fill="#212529">→ 上下推力相等时水平净力为零，不干扰升力与姿态</text>
  <text x="548.0" y="268.0" font-size="12.3" text-anchor="start" fill="#e03131">若上下装成同向：力偶抵消，偏航权限只剩桨反扭矩（约 2%）</text>
  <text x="548.0" y="291.0" font-size="12.3" text-anchor="start" fill="#e03131">若整组装反：偏航符号翻转，PID 变正反馈，一离地就自旋</text>
  <text x="548.0" y="337.0" font-size="12.3" text-anchor="start" fill="#868e96">本方案取消原 2° 向心分量（四向约束下无法与切向分量叠加）</text>
</svg>