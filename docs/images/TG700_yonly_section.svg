<text x="756.0" y="179.0" text-anchor="start" font-size="13" fill="#1f6fb4" font-weight="bold">CW</text>
<line x1="670.0" y1="148.0" x2="730.0" y2="148.0" stroke="#1f6fb4" stroke-width="2.8" marker-end="url(#au)"/>
<text x="744.0" y="144.0" text-anchor="start" font-size="13" fill="#1f6fb4" font-weight="bold">右</text>
<line x1="600.8" y1="311.8" x2="739.2" y2="272.2" stroke="#c1452b" stroke-width="6" stroke-linecap="round"/>
<circle cx="670.0" cy="292.0" r="7" fill="#c1452b"/>
<text x="584.0" y="297.0" text-anchor="end" font-size="13" fill="#1c1c1c" font-weight="bold">下层</text>
<text x="756.0" y="297.0" text-anchor="start" font-size="13" fill="#c1452b" font-weight="bold">CCW</text>
<line x1="670.0" y1="266.0" x2="610.0" y2="266.0" stroke="#c1452b" stroke-width="2.8" marker-end="url(#al)"/>
<text x="596.0" y="262.0" text-anchor="end" font-size="13" fill="#c1452b" font-weight="bold">左</text>
<text x="670.0" y="392.0" text-anchor="middle" font-size="12" fill="#12862f" font-weight="normal">两台水平力反向 → 推力差动时力矩相加，组内推力和不变</text>
</svg>